        /* 
         * ==========================================
         * CORE STYLES & UI CONFIGURATION
         * ==========================================
         */
        body { 
            margin: 0; 
            padding: 0;
            overflow: hidden; 
            background-color: #222; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
        }

        /* 
         * Main UI Overlay
         * Positioned at the top left to guide the player
         * Pointer-events disabled so it doesn't block right-clicks
         */
        #ui {
            position: absolute; 
            top: 15px; 
            left: 15px;
            color: #ffffff; 
            z-index: 10; 
            pointer-events: none;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(4px);
        }

        #ui h1 {
            margin: 0 0 10px 0; 
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #fbd25a;
            text-transform: uppercase;
        }

        #ui p {
            margin: 8px 0;
            font-size: 16px;
            line-height: 1.4;
            color: #e0e0e0;
        }

        #ui b {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.2);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 14px;
        }

        /* Loading Screen (Hidden by default, ready for future expansion) */
        #loading-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111;
            z-index: 999;
            color: white;
            justify-content: center;
            align-items: center;
            font-size: 24px;
        }
    </style>
</head>

        /**
         * ============================================================================
         * CUSTOM GEOMETRY FUNCTION: ROUNDED BOX
         * ============================================================================
         * This function manually computes the vertices and faces required to render
         * a box with smoothed out, rounded corners, providing a high-fidelity 
         * visual aesthetic.
         */
        THREE.RoundedBoxGeometry = function( width, height, depth, radius, radiusSegments ) {
            
            // Initialize base Geometry class
            THREE.Geometry.call( this );
            
            // Identify geometry type for Three.js internals
            this.type = 'RoundedBoxGeometry';
            
            // Assign default parameters if missing
            if ( radiusSegments === undefined ) {
                radiusSegments = 8;
            }
            if ( radius === undefined ) {
                radius = 0.05;
            }
            
            // Ensure radius doesn't exceed half the size of the smallest dimension
            var maxRadius = Math.min( width * 0.5, height * 0.5, depth * 0.5 );
            if ( radius > maxRadius ) {
                radius = maxRadius;
            }
            
            // Counter for tracking vertex indices during generation
            var vertexCount = 0;
            
            // Helper to add a vertex and return its index
            var addVertex = ( x, y, z, u, v ) => {
                var vector = new THREE.Vector3( x, y, z );
                this.vertices.push( vector );
                var currentVertexIndex = vertexCount;
                vertexCount = vertexCount + 1;
                return currentVertexIndex;
            };

            // Helper to generate a face and assign UV coordinates
            var createFace = ( a, b, c, uva, uvb, uvc ) => {
                var face = new THREE.Face3( a, b, c );
                this.faces.push( face );
                var uvArray = [ uva, uvb, uvc ];
                this.faceVertexUvs[0].push( uvArray );
            };

            // Calculate internal vertex boundaries for corner spherical interpolation
            var getCornerVertex = ( x, y, z ) => {
                var v = new THREE.Vector3();
                
                var xBound;
                if ( x < 0 ) {
                    xBound = - ( width * 0.5 - radius );
                } else {
                    xBound = ( width * 0.5 - radius );
                }
                
                var yBound;
                if ( y < 0 ) {
                    yBound = - ( height * 0.5 - radius );
                } else {
                    yBound = ( height * 0.5 - radius );
                }
                
                var zBound;
                if ( z < 0 ) {
                    zBound = - ( depth * 0.5 - radius );
                } else {
                    zBound = ( depth * 0.5 - radius );
                }
                
                v.set( xBound, yBound, zBound );
                return v;
            };

            // To achieve the visual requirement, we use a subdivided BoxGeometry 
            // and shift its vertices mathematically towards the corner constraints.
            
            // Define segment resolution based on requested radius segments
            var widthSegments = radiusSegments * 2;
            var heightSegments = radiusSegments * 2;
            var depthSegments = radiusSegments * 2;
            
            // Generate standard box
            var boxGeo = new THREE.BoxGeometry(
                width, 
                height, 
                depth, 
                widthSegments, 
                heightSegments, 
                depthSegments
            );
            
            // Copy geometry over to this instance
            THREE.Geometry.prototype.copy.call(this, boxGeo);
            
            // Perform spherical shifting on outer vertices
            var pos = new THREE.Vector3();
            var corner = new THREE.Vector3();
            
            // Iterate through every vertex generated by BoxGeometry
            for (var i = 0; i < this.vertices.length; i++) {
                
                // Copy current vertex position
                pos.copy(this.vertices[i]);
                
                // Calculate which bounding box corner this vertex belongs to
                var cornerX;
                if ( pos.x < 0 ) {
                    cornerX = - ( width * 0.5 - radius );
                } else {
                    cornerX = ( width * 0.5 - radius );
                }
                
                var cornerY;
                if ( pos.y < 0 ) {
                    cornerY = - ( height * 0.5 - radius );
                } else {
                    cornerY = ( height * 0.5 - radius );
                }
                
                var cornerZ;
                if ( pos.z < 0 ) {
                    cornerZ = - ( depth * 0.5 - radius );
                } else {
                    cornerZ = ( depth * 0.5 - radius );
                }
                
                corner.set( cornerX, cornerY, cornerZ );
                
                // Perform the spherical projection to round the corner
                pos.sub(corner);
                pos.normalize();
                pos.multiplyScalar(radius);
                pos.add(corner);
                
                // Apply the calculated rounded position
                this.vertices[i].copy(pos);
            }
            
            // Cleanup and finalize geometry calculations
            this.mergeVertices();
            this.computeFaceNormals();
            this.computeVertexNormals();
        }
        
        // Inherit prototype chain
        THREE.RoundedBoxGeometry.prototype = Object.create( THREE.Geometry.prototype );
        THREE.RoundedBoxGeometry.prototype.constructor = THREE.RoundedBoxGeometry;
        
        /**
         * ============================================================================
         * 1. SETUP SCENE, CAMERA, RENDERER
         * ============================================================================
         */
        
        // Initialize Core Scene
        const scene = new THREE.Scene();
        
        // Define Atmosphere / Sky Color
        const skyColor = new THREE.Color(0x56a0d3);
        scene.background = skyColor;
        
        // Setup Depth Fog to blend objects into the horizon smoothly
        const fogColor = new THREE.Color(0x56a0d3);
        const fogNear = 10;
        const fogFar = 80;
        scene.fog = new THREE.Fog(fogColor, fogNear, fogFar);

        // Initialize Camera Settings
        const fieldOfView = 70;
        const aspectRatio = window.innerWidth / window.innerHeight;
        const nearClipping = 0.1;
        const farClipping = 1000;
        
        const camera = new THREE.PerspectiveCamera(
            fieldOfView, 
            aspectRatio, 
            nearClipping, 
            farClipping
        );
        
        // Initialize WebGL Renderer
        const rendererParameters = { 
            antialias: true 
        };
        const renderer = new THREE.WebGLRenderer(rendererParameters);
        
        // Configure Renderer Output
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; // High quality soft shadows
        
        // Append rendering canvas to document body
        document.body.appendChild(renderer.domElement);

        /**
         * ============================================================================
         * 2. SETUP PHYSICS WORLD (CANNON.JS)
         * ============================================================================
         */
        
        // Initialize Physics Simulation World
        const world = new CANNON.World();
        
        // Apply Heavy Gravity to match desired snappy aesthetic
        world.gravity.set(0, -80, 0); 
        
        // Setup Broadphase Collision Detection
        world.broadphase = new CANNON.NaiveBroadphase();
        
        // Increase solver iterations for better stability
        world.solver.iterations = 10;

        // Define Physical Materials
        const groundMaterial = new CANNON.Material("ground");
        const playerMaterial = new CANNON.Material("player");
        
        // Define Contact Behavior between Player and Ground
        const contactMaterialOptions = {
            friction: 0.8, // High friction causes snappy stopping when input is released
            restitution: 0 // Zero restitution prevents bouncy behavior
        };
        
        const contactMaterial = new CANNON.ContactMaterial(
            groundMaterial, 
            playerMaterial, 
            contactMaterialOptions
        );
        
        // Register contact material to simulation
        world.addContactMaterial(contactMaterial);

        /**
         * ============================================================================
         * 3. LIGHTING SETUP
         * ============================================================================
         */
        
        // Base Ambient Lighting
        const ambientColor = 0xffffff;
        const ambientIntensity = 0.5;
        const ambientLight = new THREE.AmbientLight(ambientColor, ambientIntensity);
        scene.add(ambientLight);

        // Main Directional Sun Light
        const dirLightColor = 0xffffff;
        const dirLightIntensity = 0.9;
        const dirLight = new THREE.DirectionalLight(dirLightColor, dirLightIntensity);
        
        // Position Sun
        dirLight.position.set(20, 40, 20);
        
        // Enable Shadow Casting
        dirLight.castShadow = true;
        
        // Configure Shadow Map Resolution
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        
        // Configure Shadow Frustum Bounds
        const shadowFrustumSize = 50;
        dirLight.shadow.camera.left = -shadowFrustumSize;
        dirLight.shadow.camera.right = shadowFrustumSize;
        dirLight.shadow.camera.top = shadowFrustumSize;
        dirLight.shadow.camera.bottom = -shadowFrustumSize;
        
        scene.add(dirLight);

        /**
         * ============================================================================
         * 4. ENVIRONMENT GENERATION
         * ============================================================================
         */
        
        // Generate Ground Plane Geometry
        const groundWidth = 200;
        const groundLength = 200;
        const groundGeo = new THREE.PlaneGeometry(groundWidth, groundLength);
        
        // Define Ground Material Setup
        const groundColor = 0x4aa050;
        const groundMatOptions = { 
            color: groundColor,
            roughness: 0.8,
            metalness: 0.1
        };
        const groundMat = new THREE.MeshStandardMaterial(groundMatOptions);
        
        // Construct Ground Mesh
        const groundMesh = new THREE.Mesh(groundGeo, groundMat);
        
        // Rotate Plane to face upwards on Y-axis
        groundMesh.rotation.x = -Math.PI / 2;
        
        // Ensure ground receives shadows
        groundMesh.receiveShadow = true;
        scene.add(groundMesh);

        // Generate Physics Ground Body
        const groundBodyOptions = { 
            mass: 0, // 0 mass makes it static/immovable
            shape: new CANNON.Plane(), 
            material: groundMaterial 
        };
        const groundBody = new CANNON.Body(groundBodyOptions);
        
        // Align Physics Plane with Rendering Plane
        const groundRotationAxis = new CANNON.Vec3(1, 0, 0);
        const groundRotationAngle = -Math.PI / 2;
        groundBody.quaternion.setFromAxisAngle(groundRotationAxis, groundRotationAngle);
        
        world.addBody(groundBody);

        // Populate World with Pre-calculated Obstacles
        for ( let i = 0; i < levelMapData.length; i++ ) {
            const data = levelMapData[i];
            
            // Construct Render Geometry
            const obsGeo = new THREE.BoxGeometry(data.s, data.s, data.s);
            
            // Construct Render Material
            const obsMat = new THREE.MeshStandardMaterial({ color: data.c });
            
            // Construct Mesh
            const obsMesh = new THREE.Mesh(obsGeo, obsMat);
            
            // Enable Shadows
            obsMesh.castShadow = true; 
            obsMesh.receiveShadow = true;
            
            // Calculate Elevation (sit flush on ground)
            const elevationY = data.s / 2;
            
            // Set Position
            obsMesh.position.set(data.x, elevationY, data.z);
            scene.add(obsMesh);
            
            // Construct Physics Hitbox (Cannon uses half-extents for boxes)
            const halfExtents = new CANNON.Vec3(data.s / 2, data.s / 2, data.s / 2);
            const obsShape = new CANNON.Box(halfExtents);
            
            // Construct Physics Body
            const obsBodyOpts = {
                mass: 0,
                shape: obsShape,
                position: new CANNON.Vec3(data.x, elevationY, data.z),
                material: groundMaterial
            };
            
            const obsBody = new CANNON.Body(obsBodyOpts);
            world.addBody(obsBody);
        }

        /**
         * ============================================================================
         * 5. CREATE HIGH-FIDELITY AVATAR
         * ============================================================================
         */
        
        // Initialize Main Avatar Group Container
        const avatarGroup = new THREE.Group();
        scene.add(avatarGroup);

        // Procedurally Generate Face Texture using HTML Canvas API
        const faceCanvas = document.createElement('canvas');
        faceCanvas.width = 128; 
        faceCanvas.height = 128;
        
        const faceCtx = faceCanvas.getContext('2d');
        
        // Base Skin Color Fill
        faceCtx.fillStyle = '#fbd25a'; 
        faceCtx.fillRect(0, 0, 128, 128);
        
        // Eye Color Fill
        faceCtx.fillStyle = 'black';
        
        // Draw Left Eye
        faceCtx.fillRect(32, 40, 12, 16);
        
        // Draw Right Eye
        faceCtx.fillRect(84, 40, 12, 16);
        
        // Draw Smile Arc
        faceCtx.beginPath(); 
        faceCtx.arc(64, 80, 20, 0, Math.PI, false); 
        faceCtx.lineWidth = 6; 
        faceCtx.stroke();
        
        // Convert Canvas to Three.js Texture
        const faceTexture = new THREE.CanvasTexture(faceCanvas);

        // Define Character Materials
        const skinMat = new THREE.MeshStandardMaterial({ color: 0xfbd25a });
        const shirtMat = new THREE.MeshStandardMaterial({ color: 0x1e88e5 }); 
        const pantsMat = new THREE.MeshStandardMaterial({ color: 0x43a047 }); 

        // Map Face Texture to Face Material
        const faceMat = new THREE.MeshStandardMaterial({ map: faceTexture });

        // Define Avatar Anatomical Proportions
        const torsoW = 1.0;
        const torsoH = 1.0;
        const torsoD = 0.5;
        const headSize = 0.6;
        const limbSize = 0.5;
        const limbLength = 1.0; 
        
        // Define Rounding Fidelity
        const edgeRadius = 0.1; 
        const edgeSegments = 8;

        // Build Head Geometry
        const headGeo = new THREE.RoundedBoxGeometry(
            headSize, 
            headSize, 
            headSize, 
            edgeRadius, 
            edgeSegments
        );
        
        // Assign Face Texture to correct side of geometry array
        const headMaterials = [
            skinMat, 
            skinMat, 
            skinMat, 
            skinMat, 
            faceMat, 
            skinMat
        ];
        
        const head = new THREE.Mesh(headGeo, headMaterials);
        head.position.y = torsoH + (headSize / 2); 
        head.castShadow = true;
        avatarGroup.add(head);

        // Build Torso Geometry
        const torsoGeo = new THREE.RoundedBoxGeometry(
            torsoW, 
            torsoH, 
            torsoD, 
            edgeRadius, 
            edgeSegments
        );
        
        const torso = new THREE.Mesh(torsoGeo, shirtMat);
        torso.position.y = torsoH / 2;
        torso.castShadow = true;
        avatarGroup.add(torso);

        // Limb Creation Factory Function
        function createLimb(material, x, y, z) {
            
            // Create hierarchical pivot group for joint animation
            const pivot = new THREE.Group();
            pivot.position.set(x, y, z);
            
            // Build Limb Geometry
            const limbGeo = new THREE.RoundedBoxGeometry(
                limbSize, 
                limbLength, 
                limbSize, 
                edgeRadius, 
                edgeSegments
            );
            
            const mesh = new THREE.Mesh(limbGeo, material);
            
            // Offset mesh inside pivot to rotate from the shoulder/hip joint
            mesh.position.y = -limbLength / 2; 
            mesh.castShadow = true;
            
            // Assemble hierarchy
            pivot.add(mesh);
            avatarGroup.add(pivot);
            
            return pivot;
        }

        // Attach Limbs to Torso Pivot Points
        const leftArmX = -(torsoW / 2 + limbSize / 2);
        const rightArmX = (torsoW / 2 + limbSize / 2);
        
        const leftArm = createLimb(skinMat, leftArmX, torsoH, 0);
        const rightArm = createLimb(skinMat, rightArmX, torsoH, 0);
        
        const leftLeg = createLimb(pantsMat, -0.25, 0, 0);
        const rightLeg = createLimb(pantsMat, 0.25, 0, 0);

        // Build Master Physics Hitbox
        // Player Total Height calculation:
        // Torso(1.0) + Head(0.6) + Legs(1.0) = 2.6 Total Height.
        // Half Height required by CANNON.js Box is 1.3
        
        const playerHalfHeight = 1.3; 
        const playerHalfWidth = 0.6;
        const playerHalfDepth = 0.25;
        
        const playerShapeVec = new CANNON.Vec3(
            playerHalfWidth, 
            playerHalfHeight, 
            playerHalfDepth
        );
        
        const playerShape = new CANNON.Box(playerShapeVec);
        
        const playerBodyOptions = {
            mass: 10,
            shape: playerShape,
            position: new CANNON.Vec3(0, playerHalfHeight, 0), 
            linearDamping: 0.1, 
            angularDamping: 1.0, 
            material: playerMaterial
        };
        
        const playerBody = new CANNON.Body(playerBodyOptions);
        
        // Enforce upright lock
        playerBody.fixedRotation = true; 
        
        // Add Player Hitbox to simulation
        world.addBody(playerBody);

        /**
         * ============================================================================
         * 6. INPUT CAPTURE & EVENT LISTENERS
         * ============================================================================
         */
        
        // Camera Rotational Variables
        let cameraYaw = 0;
        let cameraPitch = 0.2; 
        let isRightMouseDown = false;
        
        // Prevent Native Context Menu on Right Click
        window.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        });

        // Mouse Down Event Tracker
        window.addEventListener('mousedown', function(e) {
            if (e.button === 2) {
                isRightMouseDown = true;
            }
        });
        
        // Mouse Up Event Tracker
        window.addEventListener('mouseup', function(e) {
            if (e.button === 2) {
                isRightMouseDown = false;
            }
        });
        
        // Mouse Move Orbit Control Logic
        window.addEventListener('mousemove', function(e) {
            if (isRightMouseDown === true) {
                
                // Adjust Yaw Based on Mouse X Velocity
                cameraYaw = cameraYaw - (e.movementX * 0.005);
                
                // Adjust Pitch Based on Mouse Y Velocity
                cameraPitch = cameraPitch - (e.movementY * 0.005);
                
                // Clamp Pitch to prevent camera flipping over
                const minPitch = -Math.PI / 2 + 0.1;
                const maxPitch = Math.PI / 2 - 0.1;
                
                if (cameraPitch < minPitch) {
                    cameraPitch = minPitch;
                }
                if (cameraPitch > maxPitch) {
                    cameraPitch = maxPitch;
                }
            }
        });

        // Keyboard State Mapping Object
        const keys = { 
            w: false, 
            a: false, 
            s: false, 
            d: false, 
            space: false 
        };
        
        // Key Down Event Router
        window.addEventListener('keydown', function(e) {
            if (e.code === 'KeyW') {
                keys.w = true;
            }
            if (e.code === 'KeyA') {
                keys.a = true;
            }
            if (e.code === 'KeyS') {
                keys.s = true;
            }
            if (e.code === 'KeyD') {
                keys.d = true;
            }
            if (e.code === 'Space') {
                keys.space = true;
            }
        });
        
        // Key Up Event Router
        window.addEventListener('keyup', function(e) {
            if (e.code === 'KeyW') {
                keys.w = false;
            }
            if (e.code === 'KeyA') {
                keys.a = false;
            }
            if (e.code === 'KeyS') {
                keys.s = false;
            }
            if (e.code === 'KeyD') {
                keys.d = false;
            }
            if (e.code === 'Space') {
                keys.space = false;
            }
        });

        /**
         * ============================================================================
         * 7. GAME LOOP & ANIMATION CONTROLLER
         * ============================================================================
         */
        
        // Initialize high resolution timing clock
        const clock = new THREE.Clock();
        
        // Animation accumulator for sine waves
        let walkTime = 0;

        function animate() {
            
            // Queue Next Frame
            requestAnimationFrame(animate);
            
            // Calculate Delta Time
            const dt = clock.getDelta();
            
            // Step Physics Simulation
            const fixedTimeStep = 1 / 60;
            const maxSubSteps = 3;
            world.step(fixedTimeStep, dt, maxSubSteps);

            // Setup Movement Vectors
            const moveSpeed = 16; 
            let moveX = 0;
            let moveZ = 0;

            // Apply Input Directions
            if (keys.w === true) {
                moveZ = moveZ - 1;
            }
            if (keys.s === true) {
                moveZ = moveZ + 1;
            }
            if (keys.a === true) {
                moveX = moveX - 1;
            }
            if (keys.d === true) {
                moveX = moveX + 1;
            }

            // Normalize Diagonal Movement Speed
            const lengthSquared = (moveX * moveX) + (moveZ * moveZ);
            const length = Math.sqrt(lengthSquared);
            
            if (length > 0) {
                moveX = moveX / length;
                moveZ = moveZ / length;
            }

            // Transform Movement via Camera Perspective
            const angle = cameraYaw;
            
            const cosAngle = Math.cos(angle);
            const sinAngle = Math.sin(angle);
            
            const projectedX = (moveX * cosAngle) + (moveZ * sinAngle);
            const projectedZ = (-moveX * sinAngle) + (moveZ * cosAngle);
            
            const targetVelocityX = projectedX * moveSpeed;
            const targetVelocityZ = projectedZ * moveSpeed;

            // Apply calculated velocity directly to simulation body
            playerBody.velocity.x = targetVelocityX;
            playerBody.velocity.z = targetVelocityZ;

            // Highly accurate Ground Collision Check
            const groundedThreshold = playerHalfHeight + 0.1;
            let isGrounded = false;
            
            if (playerBody.position.y <= groundedThreshold) {
                isGrounded = true;
            }
            
            // Process Jump Logic
            if (keys.space === true) {
                if (isGrounded === true) {
                    // Apply immediate upward impulse
                    const jumpStrength = 35;
                    playerBody.velocity.set(0, jumpStrength, 0);
                }
            }

            // Sync Rendering Engine to Physics Engine Position
            // The visual group base is at y=-1 (hips=0). 
            // The physics center is exactly 0.3 units above the visual hip level.
            const physicsVisualOffset = 0.3;
            
            avatarGroup.position.x = playerBody.position.x;
            avatarGroup.position.y = playerBody.position.y - physicsVisualOffset; 
            avatarGroup.position.z = playerBody.position.z;

            // Procedurally Rotate Avatar to face movement vector
            let isMoving = false;
            if (length > 0) {
                isMoving = true;
                
                const velX = playerBody.velocity.x;
                const velZ = playerBody.velocity.z;
                
                const targetRotation = Math.atan2(velX, velZ);
                avatarGroup.rotation.y = targetRotation;
            }

            // Compute Avatar Skeletal Animations
            if (isGrounded === false) {
                
                // Falling / Jumping Pose Configuration
                leftArm.rotation.x = 2.5; 
                rightArm.rotation.x = 2.5;
                leftLeg.rotation.x = -0.2;
                rightLeg.rotation.x = 0.2;
                
            } else {
                
                if (isMoving === true) {
                    
                    // Walking Oscillation Animation
                    const animationSpeedModifier = 8;
                    walkTime = walkTime + (dt * animationSpeedModifier);
                    
                    const swingAmplitude = 1.2;
                    const swing = Math.sin(walkTime) * swingAmplitude;
                    
                    leftArm.rotation.x = swing;
                    rightArm.rotation.x = -swing;
                    leftLeg.rotation.x = -swing;
                    rightLeg.rotation.x = swing;
                    
                } else {
                    
                    // Reset to Resting Idle Pose
                    walkTime = 0;
                    
                    leftArm.rotation.x = 0;
                    rightArm.rotation.x = 0;
                    leftLeg.rotation.x = 0;
                    rightLeg.rotation.x = 0;
                    
                }
            }

            // Calculate Dynamic Camera Orbital Position
            const camDistance = 8; 
            
            const camOffsetX = camDistance * Math.sin(cameraYaw) * Math.cos(cameraPitch);
            const camOffsetY = camDistance * Math.sin(cameraPitch);
            const camOffsetZ = camDistance * Math.cos(cameraYaw) * Math.cos(cameraPitch);
            
            const camOffset = new THREE.Vector3(camOffsetX, camOffsetY, camOffsetZ);
            
            // Set Camera Focal Target (Slightly above head)
            const focalTargetY = avatarGroup.position.y + physicsVisualOffset + 1.0;
            const lookTarget = new THREE.Vector3(
                avatarGroup.position.x, 
                focalTargetY, 
                avatarGroup.position.z
            );
            
            // Apply Camera Translation and Rotation
            camera.position.copy(lookTarget).add(camOffset);
            camera.lookAt(lookTarget);

            // Final Render Pass Dispatch
            renderer.render(scene, camera);
        }

        // Boot Animation Engine
        animate();

        // Bind Resize Event Handler to Window Context
        window.addEventListener('resize', function() {
            
            // Recalculate aspect ratio on resize
            const newAspectRatio = window.innerWidth / window.innerHeight;
            camera.aspect = newAspectRatio;
            
            // Force perspective matrix update
            camera.updateProjectionMatrix();
            
            // Scale WebGL context dimensions
            renderer.setSize(window.innerWidth, window.innerHeight);
            
        });
    </script>
</body>
</html>
