<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JUST superblocks - Complete Engine</title>
    <style>
        /* ==========================================
           SIMPLE, CLEAN, RETRO UI STYLING
           ========================================== */
        * {
            box-sizing: border-box;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background-color: #111111;
            color: #ffffff;
            font-family: Arial, sans-serif;
            user-select: none;
        }

        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* MAIN MENU CONTAINER */
        #main-menu {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: #222222;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .menu-box {
            background-color: #333333;
            padding: 40px;
            border: 3px solid #555555;
            text-align: center;
            width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        h1 {
            margin: 0 0 25px 0;
            font-size: 32px;
            color: #ffffff;
            letter-spacing: 2px;
        }

        input {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            margin-bottom: 15px;
            border: 2px solid #000000;
            background: #ffffff;
            color: #000000;
            outline: none;
        }

        input:focus {
            border-color: #ff9900;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            font-size: 16px;
            font-weight: bold;
            font-family: Arial, sans-serif;
            margin-bottom: 12px;
            border: 2px solid #000000;
            cursor: pointer;
            color: #000000;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn:hover {
            background-color: #ffffff;
            transform: translateY(-2px);
        }

        .btn:active {
            transform: translateY(1px);
        }

        #btn-obby { background-color: #ff9900; }
        #btn-void { background-color: #9900ff; color: #ffffff; }
        #btn-lava { background-color: #cc0000; color: #ffffff; }

        #error-msg {
            color: #ff5555;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            min-height: 20px;
        }

        /* IN-GAME HUD */
        #hud {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
        }

        .interactive-hud {
            pointer-events: auto;
        }

        #btn-quit {
            background-color: #cc0000;
            color: white;
            border: 2px solid #000000;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            font-family: Arial, sans-serif;
        }

        #btn-quit:hover {
            background-color: #ff3333;
        }

        .stats {
            background-color: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border: 2px solid #555555;
            font-size: 14px;
            line-height: 1.6;
            width: 220px;
        }
    </style>
</head>
<body>

    <!-- MAIN MENU SCREEN -->
    <div id="main-menu">
        <div class="menu-box">
            <h1>SUPERBLOCKS</h1>
            <input type="text" id="playerName" placeholder="Enter Username..." maxlength="12" autocomplete="off">
            <div id="error-msg"></div>
            <button class="btn" id="btn-obby">Play Obby</button>
            <button class="btn" id="btn-void">Play Dark Void</button>
            <button class="btn" id="btn-lava">Play Lava Survival</button>
        </div>
    </div>

    <!-- IN-GAME HUD SCREEN -->
    <div id="hud" class="interactive-hud">
        <button id="btn-quit">QUIT TO MENU</button>
        <div class="stats">
            <div id="stat-fps">FPS: 0</div>
            <div id="stat-mode">Mode: None</div>
            <div id="stat-pos">Pos: 0, 0, 0</div>
        </div>
    </div>

    <!-- MAIN ENGINE SCRIPT -->
    <script type="module" src="game.js"></script>
</body>
</html>
